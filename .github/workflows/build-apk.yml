name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & build assets
        run: |
          npm install
          npm run build
          mkdir -p dist
          cp -r .output/public/* dist/ || true
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DesiSaloon</title><link rel="stylesheet" href="/assets/styles-b4eq38ZI.css"></head><body><div id="root"></div><script type="module" src="/assets/index-CJZimjuG.js"></script></body></html>' > dist/index.html

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesiSaloon-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
